<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>monaco-wasm basic</title>
    <link rel="icon" href="data:," />
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; }
      #editor { height: 20rem; width: 100%; min-width: 0; border: 1px solid #ccc; }
      #controls { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
      #output { white-space: pre-wrap; background: #f4f4f4; padding: 0.5rem; }
    </style>
  </head>
  <body>
    <div id="controls">
      <button id="save">Save</button>
      <button id="replace">Replace document</button>
      <button id="read-only">Toggle read-only</button>
      <button id="mount">Unmount</button>
    </div>
    <div id="editor"></div>
    <pre id="output"></pre>
    <script type="module">
      // Relative URL, so the page works under any deployment path such as /demo/.
      import init, { App } from "./pkg/wasm_basic.js";

      await init();
      const output = document.getElementById("output");
      const app = new App(document.getElementById("editor"));
      const report = (action) => {
        try {
          const result = action();
          if (result !== undefined) output.textContent = String(result);
        } catch (error) {
          output.textContent = `Error: ${error}`;
        }
      };
      report(() => app.mount());

      document.getElementById("save").onclick = () => report(() => app.save());
      document.getElementById("replace").onclick = () => report(() => app.replaceDocument());
      document.getElementById("read-only").onclick = () =>
        report(() => `read-only: ${app.toggleReadOnly()}`);
      const mountButton = document.getElementById("mount");
      mountButton.onclick = () =>
        report(() => {
          app.mounted() ? app.unmount() : app.mount();
          mountButton.textContent = app.mounted() ? "Unmount" : "Mount";
        });
      window.demoApp = app;
    </script>
  </body>
</html>
