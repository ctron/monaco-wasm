[package]
name = "leptos-hydrate"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", optional = true }
leptos = "0.8"
leptos_axum = { version = "0.8", optional = true }
monaco-leptos.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
hydrate = ["leptos/hydrate", "monaco-leptos/hydrate", "dep:wasm-bindgen"]
ssr = ["dep:axum", "dep:leptos_axum", "dep:tokio", "leptos/ssr", "monaco-leptos/ssr"]

[lints]
workspace = true

[package.metadata.leptos]
output-name = "leptos-hydrate"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3400"
reload-port = 3401
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
