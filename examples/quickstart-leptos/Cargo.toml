[package]
name = "quickstart-leptos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# In your own project: monaco-leptos = { version = "0.1", features = ["csr"] }
monaco-leptos = { path = "../../crates/monaco-leptos", features = ["csr"] }
# Only for the playground's extras (formatting, download, theme detection).
js-sys = "0.3.77"
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "HtmlAnchorElement",
    "MediaQueryList",
    "Url",
    "Window",
] }
