[package]
name = "monaco-yew"
description = "Yew component for the Monaco editor, with the editor runtime and workers bundled"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords = ["monaco", "editor", "yew", "wasm", "code-editor"]
categories = ["wasm", "web-programming", "text-editors", "gui"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**/*.rs"]

[dependencies]
monaco-wasm.workspace = true
web-sys = { workspace = true, features = ["HtmlElement"] }
yew.workspace = true

[dev-dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "Window"] }
yew = { workspace = true, features = ["csr"] }

[lints]
workspace = true
