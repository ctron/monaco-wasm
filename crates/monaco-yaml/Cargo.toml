[package]
name = "monaco-yaml"
description = "Optional YAML module for monaco-wasm, with bundled language services and worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**/*.rs", "js/*"]

[dependencies]
monaco-wasm.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "Window"] }

[lints]
workspace = true
