[workspace]
resolver = "3"
members = [
    "crates/monaco-dioxus",
    "crates/monaco-leptos",
    "crates/monaco-wasm",
    "crates/monaco-yew",
    "examples/dioxus-basic",
    "examples/dioxus-hydrate",
    "examples/leptos-basic",
    "examples/leptos-hydrate",
    "examples/quickstart-dioxus",
    "examples/quickstart-leptos",
    "examples/quickstart-yew",
    "examples/wasm-basic",
    "examples/yew-basic",
    "examples/yew-multiple",
    "examples/yew-persist",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
# Oldest Rust that builds every published crate; checked in CI.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/ctron/monaco-wasm"
homepage = "https://ctron.github.io/monaco-wasm/"

[workspace.dependencies]
# The workspace's own crates. Cargo requires the version to be repeated here
# for publishing; keep it equal to workspace.package.version.
monaco-dioxus = { path = "crates/monaco-dioxus", version = "0.1.3" }
monaco-leptos = { path = "crates/monaco-leptos", version = "0.1.3" }
monaco-wasm = { path = "crates/monaco-wasm", version = "0.1.3" }
monaco-yew = { path = "crates/monaco-yew", version = "0.1.3" }

# Frameworks without default features: members select the rendering mode.
dioxus = { version = "0.7", default-features = false }
leptos = { version = "0.8", default-features = false }
yew = { version = "0.23", default-features = false }

axum = "0.8"
gloo-storage = "0.3"
gloo-timers = "0.3"
js-sys = "0.3.77"
leptos_axum = "0.8"
serde_json = "1"
tokio = "1"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
wasm-bindgen-test = "0.3.50"
web-sys = "0.3.77"

[workspace.lints.clippy]
# The option structs are #[non_exhaustive]; assigning fields after
# Default::default() is the intended construction pattern.
field_reassign_with_default = "allow"

# cargo-release configuration: `cargo release <level> --execute` bumps the
# version of all crates together, commits, creates a single `v<version>` tag,
# and pushes. Publishing to crates.io is done by .github/workflows/release.yml
# when the tag arrives.
[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
publish = false
allow-branch = ["main"]
