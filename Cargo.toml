[workspace]
resolver = "3"
members = ["crates/monaco-leptos", "crates/monaco-wasm", "crates/monaco-yew", "examples/leptos-basic", "examples/leptos-hydrate", "examples/quickstart-leptos", "examples/quickstart-yew", "examples/wasm-basic", "examples/yew-basic"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Oldest Rust that builds every published crate; checked in CI.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/ctron/monaco-wasm"
homepage = "https://ctron.github.io/monaco-wasm/"

[workspace.dependencies]
# The workspace's own crates. Cargo requires the version to be repeated here
# for publishing; keep it equal to workspace.package.version.
monaco-leptos = { path = "crates/monaco-leptos", version = "0.1.0" }
monaco-wasm = { path = "crates/monaco-wasm", version = "0.1.0" }
monaco-yew = { path = "crates/monaco-yew", version = "0.1.0" }

# Frameworks without default features: members select the rendering mode.
leptos = { version = "0.8", default-features = false }
yew = { version = "0.23", default-features = false }

axum = "0.8"
js-sys = "0.3.77"
leptos_axum = "0.8"
serde_json = "1"
tokio = "1"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
wasm-bindgen-test = "0.3.50"
web-sys = "0.3.77"

[workspace.lints.clippy]
# The option structs are #[non_exhaustive]; assigning fields after
# Default::default() is the intended construction pattern (DESIGN.md §6).
field_reassign_with_default = "allow"
