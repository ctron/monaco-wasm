name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the compiler, components, and wasm target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --target wasm32-unknown-unknown --locked -- -D warnings -A long_running_const_eval
      - run: cargo clippy -p monaco-wasm -p monaco-yew --all-targets --locked -- -D warnings
      - run: cargo test -p monaco-wasm -p monaco-yew --locked
      - run: cargo package -p monaco-wasm --locked
      # monaco-yew is packaged after monaco-wasm is published; see tools/consumer-check.sh.

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install wasm-bindgen-cli matching Cargo.lock, and wasm-pack
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
          cargo install wasm-pack --locked
          cargo install trunk --locked
      # The runner image provides Chrome and a matching chromedriver.
      - name: Core API and Yew component browser tests
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p monaco-wasm -p monaco-yew --target wasm32-unknown-unknown --locked
      - name: Yew demo under /demo/
        run: |
          (cd browser-tests && npm ci)
          (cd examples/yew-basic && trunk build --release --public-url /demo/)
          CHROMIUM="$(command -v google-chrome)" node browser-tests/smoke.mjs examples/yew-basic/dist
      - name: Packaged consumer without Node, with and without CSP
        run: |
          CHROMIUM="$(command -v google-chrome)" tools/consumer-check.sh

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: tools/runtime
      - run: npm run runtime:check
        working-directory: tools/runtime

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: tools/bindings
      # Installs the ts-gen rev pinned in tools/bindings/package.json.
      - run: npm run bindings:check
        working-directory: tools/bindings
