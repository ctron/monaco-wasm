name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml selects the compiler, components, and wasm target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --target wasm32-unknown-unknown --locked -- -D warnings -A long_running_const_eval
      - run: cargo clippy -p monaco-wasm -p monaco-yew -p monaco-leptos --all-targets --locked -- -D warnings
      # Server-side rendering builds: no browser code may run here.
      - run: cargo clippy -p monaco-leptos -p leptos-hydrate --features monaco-leptos/ssr,leptos-hydrate/ssr --locked -- -D warnings
      - run: cargo test -p monaco-wasm -p monaco-yew -p monaco-leptos --locked
      # Crate documentation, as on docs.rs; broken intra-doc links fail.
      - run: cargo doc --no-deps -p monaco-wasm -p monaco-yew -p monaco-leptos --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package -p monaco-wasm --locked
      # The adapters are packaged after monaco-wasm is published; see tools/consumer-check.sh.

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the minimum supported Rust (workspace.package.rust-version)
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
      # Resolve as a consumer on that Rust would: Cargo picks dependency
      # versions compatible with rust-version.
      - run: cargo generate-lockfile
      - run: cargo +"$MSRV" check -p monaco-wasm -p monaco-yew -p monaco-leptos --lib

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install wasm-bindgen-cli matching Cargo.lock, and wasm-pack
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
          cargo install wasm-pack --locked
          cargo install trunk --locked
          cargo install cargo-leptos --locked
      # The runner image provides Chrome and a matching chromedriver.
      - name: Core API, Yew and Leptos component browser tests
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p monaco-wasm -p monaco-yew -p monaco-leptos --target wasm32-unknown-unknown --locked
      - name: Yew and Leptos demos under /demo/
        run: |
          (cd browser-tests && npm ci)
          for demo in yew-basic leptos-basic; do
            (cd "examples/$demo" && trunk build --release --public-url /demo/)
            CHROMIUM="$(command -v google-chrome)" node browser-tests/smoke.mjs "examples/$demo/dist"
          done
      - name: Leptos SSR and hydration fixture
        run: CHROMIUM="$(command -v google-chrome)" tools/hydrate-check.sh --release
      - name: Packaged consumer without Node, with and without CSP
        run: |
          CHROMIUM="$(command -v google-chrome)" tools/consumer-check.sh

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: tools/runtime
      - run: npm run runtime:check
        working-directory: tools/runtime

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: tools/bindings
      # Installs the ts-gen rev pinned in tools/bindings/package.json.
      - run: npm run bindings:check
        working-directory: tools/bindings
