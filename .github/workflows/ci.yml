name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI on the tagged commit before publishing.
  workflow_call:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # msrv is workspace.package.rust-version.
        rust: [msrv, stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ matrix.rust }}
        run: |
          toolchain=${{ matrix.rust }}
          if [ "$toolchain" = msrv ]; then
            toolchain=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          fi
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default "$toolchain"
      # Resolve as a consumer on that Rust would: Cargo picks dependency
      # versions compatible with rust-version.
      - if: matrix.rust == 'msrv'
        run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - if: matrix.rust == 'stable'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --target wasm32-unknown-unknown --locked -- -D warnings -A long_running_const_eval
      - run: cargo clippy -p monaco-wasm -p monaco-yew -p monaco-leptos -p monaco-dioxus --all-targets --locked -- -D warnings
      # Server-side rendering builds: no browser code may run here.
      - run: cargo clippy -p monaco-leptos -p leptos-hydrate --features monaco-leptos/ssr,leptos-hydrate/ssr --locked -- -D warnings
      - run: cargo clippy -p dioxus-hydrate --features server --locked -- -D warnings
      - run: cargo test -p monaco-wasm -p monaco-yew -p monaco-leptos -p monaco-dioxus --locked
      # Crate documentation, as on docs.rs; broken intra-doc links fail.
      - run: cargo doc --no-deps -p monaco-wasm -p monaco-yew -p monaco-leptos -p monaco-dioxus --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Public API changes against the latest release on crates.io must match the
  # version bump.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # The crates' browser tests, in the workspace: tests/ is not packaged.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Setup cargo-binstall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install wasm-bindgen-cli matching Cargo.lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo binstall -y "wasm-bindgen-cli@$version"
      # The runner image provides Chrome and a matching chromedriver.
      - name: Core API and component browser tests
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p monaco-wasm -p monaco-yew -p monaco-leptos -p monaco-dioxus --features monaco-dioxus/web --target wasm32-unknown-unknown --locked

  # The crates as they would be published. Cargo verifies each package,
  # building the adapters against the packaged monaco-wasm.
  package:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p monaco-wasm -p monaco-yew -p monaco-leptos -p monaco-dioxus --locked
      - uses: actions/upload-artifact@v7
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error

  # Every example, built against the packaged crates and checked in Chrome.
  examples:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: wasm-basic
            tools: wasm-pack
            check: |
              wasm-pack build examples/wasm-basic --target web --out-dir pkg --no-pack -- --locked
              node browser-tests/smoke.mjs examples/wasm-basic
              # Again under the strictest policy the documented deployment needs (README).
              node browser-tests/smoke.mjs examples/wasm-basic --csp "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src blob:; style-src 'self' 'unsafe-inline'; font-src data:; img-src data:"
          - example: yew-basic
            tools: trunk
            check: |
              (cd examples/yew-basic && trunk build --release --locked --public-url /demo/)
              node browser-tests/smoke.mjs examples/yew-basic/dist
          - example: leptos-basic
            tools: trunk
            check: |
              (cd examples/leptos-basic && trunk build --release --locked --public-url /demo/)
              node browser-tests/smoke.mjs examples/leptos-basic/dist
          - example: dioxus-basic
            tools: trunk
            check: |
              (cd examples/dioxus-basic && trunk build --release --locked --public-url /demo/)
              node browser-tests/smoke.mjs examples/dioxus-basic/dist
          - example: leptos-hydrate
            tools: cargo-leptos
            check: tools/hydrate-check.sh leptos
          - example: dioxus-hydrate
            tools: dioxus-cli
            check: tools/hydrate-check.sh dioxus
          - example: quickstart-yew
            tools: trunk
            check: |
              (cd examples/quickstart-yew && trunk build --release --locked --public-url /demo/)
              node browser-tests/quickstart.mjs examples/quickstart-yew/dist --base /demo/
          - example: quickstart-leptos
            tools: trunk
            check: |
              (cd examples/quickstart-leptos && trunk build --release --locked --public-url /demo/)
              node browser-tests/quickstart.mjs examples/quickstart-leptos/dist --base /demo/
          - example: quickstart-dioxus
            tools: trunk
            check: |
              (cd examples/quickstart-dioxus && trunk build --release --locked --public-url /demo/)
              node browser-tests/quickstart.mjs examples/quickstart-dioxus/dist --base /demo/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: crates
          path: ${{ runner.temp }}/crates
      # Replace each workspace crate with its package. The patch makes the
      # packaged adapters use the packaged monaco-wasm, not the one on
      # crates.io, and is read by the cargo that Trunk, cargo-leptos, and dx run.
      - name: Use the packaged crates
        run: |
          echo '[patch.crates-io]' >> .cargo/config.toml
          for crate in "$RUNNER_TEMP"/crates/*.crate; do
            name=$(basename "$crate" .crate); name=${name%-*}
            rm -rf "crates/$name" && mkdir "crates/$name"
            tar -xzf "$crate" -C "crates/$name" --strip-components=1
            echo "$name.path = \"crates/$name\"" >> .cargo/config.toml
          done
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.example }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup cargo-binstall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install ${{ matrix.tools }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tool=${{ matrix.tools }}
          if [ "$tool" = dioxus-cli ]; then
            # The CLI has to match the dioxus version in Cargo.lock.
            tool="dioxus-cli@$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "dioxus") | .version')"
          fi
          cargo binstall -y "$tool"
      - run: cd browser-tests && npm ci
      # The runner image provides Chrome.
      - run: echo "CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Build and check ${{ matrix.example }}
        run: ${{ matrix.check }}

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: tools/runtime
      - run: npm run runtime:check
        working-directory: tools/runtime

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: tools/bindings
      # Installs the ts-gen rev pinned in tools/bindings/package.json.
      - run: npm run bindings:check
        working-directory: tools/bindings

  # Single check for branch protection: succeeds only if every job above
  # succeeded. Add new jobs to `needs`.
  ci:
    if: always()
    needs: [rust, semver, browser, package, examples, runtime, bindings]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of all jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if [ "$(echo "$RESULTS" | jq 'all(. == "success")')" != "true" ]; then
            echo "::error::Not all CI jobs succeeded."
            exit 1
          fi
