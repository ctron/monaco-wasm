name: Pages

# Builds examples/quickstart with Trunk, checks it in Chrome, and deploys it
# to GitHub Pages. Enable Pages with "Source: GitHub Actions" in the
# repository settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml selects the compiler and the wasm target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: |
          curl -sSfL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin trunk
          trunk --version
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        working-directory: examples/quickstart
        run: trunk build --release --locked --public-url "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the built site in Chrome
        run: |
          (cd browser-tests && npm ci)
          CHROMIUM="$(command -v google-chrome)" node browser-tests/quickstart.mjs examples/quickstart/dist \
            --base "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/quickstart/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
