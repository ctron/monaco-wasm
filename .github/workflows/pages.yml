name: Pages

# Builds the site (landing page, Yew and Leptos quickstarts) with
# tools/build-pages.sh, checks it in Chrome, and deploys it to GitHub Pages.
# Enable Pages with "Source: GitHub Actions" in the repository settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml selects the compiler and the wasm target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Setup cargo-binstall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install Trunk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall -y trunk
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the site
        run: |
          tools/build-pages.sh site "${{ steps.pages.outputs.base_path }}/" \
            "${{ github.server_url }}/${{ github.repository }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the built site in Chrome
        env:
          BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          (cd browser-tests && npm ci)
          export CHROMIUM="$(command -v google-chrome)"
          node browser-tests/pages.mjs site --base "$BASE"
          for framework in yew leptos; do
            node browser-tests/quickstart.mjs "site/$framework" --base "$BASE$framework/"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
