name: Release

# Publishes the crates when a version tag (v0.1.0, ...) is pushed, using
# crates.io trusted publishing: each crate's trusted publisher on crates.io
# must name this repository, the workflow file release.yml, and the
# environment "release".

on:
  push:
    tags: ["v*"]

jobs:
  # ensure that the version of the tag is the version of the crates
  ensure-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cargo-bins/cargo-binstall@main
      - name: Setup cargo-workspaces
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall -y cargo-workspaces
      - name: Set version
        run: cargo ws version custom "${GITHUB_REF_NAME#v}" --all --no-git-commit --force "*" --yes
      - name: Ensure this did not change anything
        run: |
          if ! git diff --exit-code; then
            echo "::error::Setting the version from the tag changed files: the tag $GITHUB_REF_NAME does not match the version of the crates."
            exit 1
          fi

  publish:
    needs: ensure-version
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Lets crates-io-auth-action exchange the job's OIDC token for a
      # short-lived crates.io token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
